<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="64" height="48">
  <defs>
    <clipPath id="es-clip">
      <rect width="640" height="480" rx="40"/>
    </clipPath>
  </defs>
  <g clip-path="url(#es-clip)">
    <!-- Stripes -->
    <path fill="#c60b1e" d="M0 0h640v480H0z"/>
    <path fill="#ffc400" d="M0 120h640v240H0z"/>
    <!-- Coat of Arms Emblem (Stylized Spain Crown & Pillars Shield) -->
